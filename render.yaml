# Render Blueprint for the API (Dashboard -> New -> Blueprint -> pick this repository).
# The web app is on Vercel and the agent on LiveKit Cloud; this file is only the API.
services:
  - type: web
    name: interviewer-api
    runtime: docker
    plan: free
    region: singapore
    # Built from the repository root so the image installs exactly what package-lock.json says.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Render expects web services on port 10000 by default.
      - key: API_PORT
        value: "10000"
      # Reverse proxies in front of the API, measured with GET /internal/whoami (RUNBOOK): Render's chain for a
      # request is  client -> Cloudflare -> Render's load balancer -> app, so the real client is 3 hops from the socket.
      # Re-measure if the caller's address ever shows up as a 10.x or Cloudflare address.
      - key: TRUST_PROXY
        value: "3"
      - key: AGENT_NAME
        value: ai-interviewer
      # The browser origin(s) allowed to call the API (CORS), comma-separated.
      - key: WEB_ORIGIN
        value: https://voice-interviewer-tau.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: KEY_ENCRYPTION_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
